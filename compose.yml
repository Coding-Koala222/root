x-dd-env: &dd-env
  DD_ENV: ${DD_ENV:-home}
  DD_AGENT_HOST: host.docker.internal
  DD_TRACE_AGENT_PORT: ${DD_TRACE_AGENT_PORT:-8126}
  DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
  DD_SITE: ${DD_SITE:-datadoghq.com}

services:
  root:
    image: docker.kepi.site/root-game:latest
    pull_policy: always
    container_name: root-game
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - root-data:/app/data/rooms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *dd-env
      PORT: 8787
      DATA_DIR: /app/data/rooms
      MAX_ROOM_AGE_DAYS: 90
      DD_SERVICE: root-game
      DD_VERSION: ${DD_VERSION:-}
    # Admin password and other secrets: put them in a .env file next to this
    # file (never commit that file). Example .env contents:
    #   ADMIN_PASSWORD=mysecret
    # docker compose loads .env automatically; env_file below injects the
    # variables directly into the container so no shell interpolation needed.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  root-data:
